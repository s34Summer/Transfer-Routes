<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Operations Hub - Summertimes Travel Ltd</title>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

    <!-- BRANDED HEADER CONTAINER -->
    <header id="mainHeader">
        <!-- Gradient Hero Band — holds every control -->
        <div class="hero-band">
            <!-- Sun gradient defs -->
            <svg style="display:none" viewBox="0 0 125 80" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="sunGradient" x1="60" y1="19" x2="60" y2="44" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#EF4444" />
                        <stop offset="40%" stop-color="#F97316" />
                        <stop offset="100%" stop-color="#FACC15" />
                    </linearGradient>
                </defs>
            </svg>
            <div class="hero-inner">
                <!-- Top row: logo + company name (left), search (right) -->
                <div class="top-row">
                    <div class="brand">
                        <div class="hero-logo">
                            <svg viewBox="0 0 125 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g stroke="#F97316" stroke-width="2.5" stroke-linecap="round">
                                    <line x1="60" y1="20" x2="60" y2="10" />
                                    <line x1="42" y1="26" x2="35" y2="19" />
                                    <line x1="78" y1="26" x2="85" y2="19" />
                                    <line x1="30" y1="40" x2="20" y2="40" />
                                    <line x1="90" y1="40" x2="100" y2="40" />
                                    <line x1="36" y1="54" x2="28" y2="61" />
                                    <line x1="84" y1="54" x2="92" y2="61" />
                                </g>
                                <path d="M 35 44 A 25 25 0 0 1 85 44 Z" fill="url(#sunGradient)" />
                                <path d="M 62 42 L 54 28 L 62 28 Z" fill="#FFFFFF" />
                                <path d="M 64 42 L 72 32 L 64 32 Z" fill="#FFFFFF" opacity="0.9" />
                                <path d="M 52 44 C 58 47, 66 47, 74 44 L 71 47 C 65 49, 59 49, 55 47 Z" fill="#0284C7" />
                                <path d="M 15 52 C 35 46, 60 56, 85 50 C 95 48, 105 52, 115 50" stroke="#0284C7" stroke-width="4" stroke-linecap="round" fill="none" />
                                <path d="M 10 59 C 30 53, 55 63, 80 57 C 92 54, 100 58, 110 56" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none" />
                                <path d="M 20 65 C 40 60, 60 68, 85 63 C 95 61, 102 64, 108 63" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" fill="none" />
                            </svg>
                        </div>
                        <div>
                            <div class="hero-title">SummerTimes <span class="lite">TRAVEL LTD</span></div>
                        </div>
                    </div>

                    <!-- SEARCH INPUT -->
                    <div class="search-wrap">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" disabled placeholder="Search name, ref, operator, hotel, rep..." class="search-input" />
                    </div>
                </div>

                <!-- Nav row: tabs, category filters, dropdown toggles (W2M style) -->
                <nav class="mainnav">
                    <button onclick="setActiveTab('arrival')" id="tabArrivalBtn" class="nav-item tab tab-active">🛬 Arrivals</button>
                    <button onclick="setActiveTab('departure')" id="tabDepartureBtn" class="nav-item tab">🛫 Departures</button>
                    <span class="nav-sep"></span>
                    <button onclick="setActivePrefix('ALL')" id="prefixAllBtn" class="nav-item chip chip-active">All</button>
                    <button onclick="setActivePrefix('TAXI')" id="prefixTaxiBtn" class="nav-item chip">Taxis</button>
                    <button onclick="setActivePrefix('SHUTTLE')" id="prefixShuttleBtn" class="nav-item chip">Shuttles</button>
                    <button onclick="setActivePrefix('ADAPTED')" id="prefixAdaptedBtn" class="nav-item chip">Adapted</button>
                    <span class="nav-sep"></span>
                    <button onclick="toggleHeader()" id="toggleBtn" class="pill-btn">
                        <span id="toggleBtnIcon" class="caret">▼</span> 📄 Uploads
                    </button>
                    <button onclick="toggleFilterBar()" id="filterToggleBtn" class="pill-btn">
                        <span id="filterToggleBtnIcon" class="caret">▼</span> 🎛 Filters
                    </button>
                </nav>

                <!-- Upload dropzone panel (collapsible) -->
                <div id="collapsibleContent" class="drop-panel hidden">
                    <div class="drop-grid">
                        <div class="drop-cell">
                            <span class="drop-label">📄 ARRIVALS PDF</span>
                            <input type="file" id="pdfArrivals" accept=".pdf" class="file-input" />
                        </div>
                        <div class="drop-cell">
                            <span class="drop-label">📄 DEPARTURES PDF</span>
                            <input type="file" id="pdfDepartures" accept=".pdf" class="file-input" />
                        </div>
                        <div class="drop-cell row-2">
                            <span class="drop-label">✈️ AIRPORT PLAN SHEET</span>
                            <input type="file" id="excelAirportPlan" accept=".xlsx, .xls" class="file-input" />
                        </div>
                        <div class="drop-cell row-2 no-left">
                            <span class="drop-label">📊 DRIVERS EXCEL SHEET</span>
                            <input type="file" id="excelDrivers" accept=".xlsx, .xls" class="file-input" />
                        </div>
                    </div>
                </div>

                <!-- Filters panel: date + operator dropdowns (collapsible) -->
                <div id="filterBarContent" class="drop-panel hidden">
                    <div class="drop-inner">
                        <!-- DATE FILTER DROPDOWN -->
                        <select id="dateSelect" onchange="handleDateFilterChange(this.value)" class="filter-select">
                            <option value="ALL">📅 All Dates</option>
                        </select>

                        <!-- TOUR OPERATOR FILTER DROPDOWN -->
                        <select id="operatorSelect" onchange="handleOperatorFilterChange(this.value)" class="filter-select">
                            <option value="ALL">🏢 All Tour Operators</option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- Illustrated clip-art scene: sun, clouds, route, hotel, transfer van, palms -->
            <svg class="hero-scene" viewBox="0 0 1100 170" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
                <!-- Sun with rays -->
                <circle cx="1005" cy="40" r="30" fill="url(#sunGradient)" />
                <g stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.9">
                    <line x1="1005" y1="0" x2="1005" y2="10" />
                    <line x1="1005" y1="70" x2="1005" y2="80" />
                    <line x1="965" y1="40" x2="955" y2="40" />
                    <line x1="1045" y1="40" x2="1055" y2="40" />
                    <line x1="977" y1="12" x2="970" y2="5" />
                    <line x1="1033" y1="68" x2="1040" y2="75" />
                    <line x1="1033" y1="12" x2="1040" y2="5" />
                    <line x1="977" y1="68" x2="970" y2="75" />
                </g>

                <!-- Clouds -->
                <g fill="#ffffff" opacity="0.9">
                    <g>
                        <ellipse cx="180" cy="24" rx="38" ry="13" />
                        <ellipse cx="212" cy="16" rx="24" ry="10" />
                        <ellipse cx="150" cy="17" rx="22" ry="9" />
                    </g>
                    <g>
                        <ellipse cx="700" cy="14" rx="30" ry="11" />
                        <ellipse cx="726" cy="8" rx="20" ry="8" />
                    </g>
                    <g opacity="0.8">
                        <ellipse cx="360" cy="44" rx="26" ry="10" />
                        <ellipse cx="384" cy="38" rx="18" ry="7" />
                    </g>
                </g>

                <!-- Route line: hotel -> stops -> airport -->
                <path d="M 62 100 Q 200 78 360 92 Q 540 104 700 84 Q 850 72 955 100" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round" />
                <g fill="#ffffff" stroke="#fbbf24" stroke-width="2">
                    <circle cx="62" cy="100" r="5" />
                    <circle cx="360" cy="92" r="5" />
                    <circle cx="700" cy="84" r="5" />
                    <circle cx="955" cy="100" r="5" />
                </g>

                <!-- Palm trees -->
                <g>
                    <path d="M 34 118 Q 40 100 34 86" stroke="#8B5A2B" stroke-width="5" fill="none" stroke-linecap="round" />
                    <g fill="#2E7D32">
                        <path d="M 34 86 Q 20 80 14 68 Q 28 74 34 86 Z" />
                        <path d="M 34 86 Q 44 78 48 66 Q 40 74 34 86 Z" />
                        <path d="M 34 86 Q 18 92 12 92 Q 24 96 34 86 Z" />
                        <path d="M 34 86 Q 48 92 56 94 Q 46 98 34 86 Z" />
                        <path d="M 34 86 Q 34 74 32 64 Q 40 74 34 86 Z" />
                    </g>
                </g>
                <g>
                    <path d="M 255 118 Q 260 100 254 84" stroke="#8B5A2B" stroke-width="5" fill="none" stroke-linecap="round" />
                    <g fill="#2E7D32">
                        <path d="M 254 84 Q 240 78 234 66 Q 248 72 254 84 Z" />
                        <path d="M 254 84 Q 264 76 268 64 Q 260 72 254 84 Z" />
                        <path d="M 254 84 Q 238 90 232 90 Q 244 94 254 84 Z" />
                        <path d="M 254 84 Q 268 90 276 92 Q 266 96 254 84 Z" />
                        <path d="M 254 84 Q 254 72 252 62 Q 260 72 254 84 Z" />
                    </g>
                </g>

                <!-- Hotel -->
                <g>
                    <rect x="84" y="46" width="74" height="50" rx="4" fill="#ffffff" />
                    <rect x="78" y="38" width="86" height="10" rx="3" fill="#f97316" />
                    <g fill="#7dd3fc" stroke="#0ea5e9" stroke-width="1.5">
                        <rect x="90" y="54" width="14" height="14" rx="2" />
                        <rect x="110" y="54" width="14" height="14" rx="2" />
                        <rect x="130" y="54" width="14" height="14" rx="2" />
                    </g>
                    <rect x="90" y="74" width="22" height="22" rx="3" fill="#0369a1" />
                    <rect x="130" y="80" width="22" height="16" rx="3" fill="#0284c7" />
                    <line x1="160" y1="20" x2="160" y2="38" stroke="#334155" stroke-width="3" />
                    <polygon points="160,20 178,25 160,30" fill="#f97316" />
                    <rect x="92" y="22" width="58" height="16" rx="8" fill="#0369a1" />
                    <text x="121" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#ffffff">HOTEL</text>
                </g>

                <!-- Transfer van (Xanthos-style green & white livery) -->
                <g>
                    <ellipse cx="560" cy="114" rx="72" ry="6" fill="#000000" opacity="0.15" />
                    <rect x="485" y="66" width="150" height="42" rx="10" fill="#ffffff" />
                    <rect x="485" y="66" width="150" height="10" rx="10" fill="#286A2B" />
                    <rect x="485" y="90" width="150" height="6" fill="#90D058" />
                    <rect x="485" y="98" width="150" height="10" rx="5" fill="#286A2B" />
                    <path d="M 600 76 L 630 76 L 630 102 Q 630 108 624 108 L 600 108 Z" fill="#286A2B" />
                    <path d="M 604 78 L 622 78 L 622 100 L 604 100 Z" fill="#bae6fd" />
                    <rect x="492" y="80" width="54" height="18" rx="4" fill="#7dd3fc" />
                    <rect x="560" y="80" width="34" height="18" rx="4" fill="#7dd3fc" />
                    <text x="518" y="95.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="800" letter-spacing="1.5" fill="#ffffff">SUMMER</text>
                    <path d="M 556 95 Q 557 91 555 87" stroke="#2F5233" stroke-width="2" fill="none" stroke-linecap="round" />
                    <path d="M 555 87 Q 548 84 546 81 Q 552 83 555 87 Z" fill="#2F5233" />
                    <path d="M 555 87 Q 562 84 564 81 Q 559 83 555 87 Z" fill="#2F5233" />
                    <path d="M 555 87 Q 548 90 546 92 Q 552 91 555 87 Z" fill="#2F5233" />
                    <path d="M 555 87 Q 562 90 564 92 Q 559 91 555 87 Z" fill="#2F5233" />
                    <circle cx="528" cy="108" r="10" fill="#1e293b" />
                    <circle cx="528" cy="108" r="4" fill="#94a3b8" />
                    <circle cx="590" cy="108" r="10" fill="#1e293b" />
                    <circle cx="590" cy="108" r="4" fill="#94a3b8" />
                    <circle cx="626" cy="90" r="4" fill="#fde047" />
                </g>

                <!-- Airport terminal (end of the route) -->
                <g>
                    <!-- Runway -->
                    <rect x="826" y="118" width="274" height="8" rx="4" fill="#cbd5e1" opacity="0.85" />
                    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
                        <line x1="865" y1="122" x2="875" y2="122" />
                        <line x1="910" y1="122" x2="920" y2="122" />
                        <line x1="955" y1="122" x2="965" y2="122" />
                        <line x1="1000" y1="122" x2="1010" y2="122" />
                        <line x1="1045" y1="122" x2="1055" y2="122" />
                        <line x1="1090" y1="122" x2="1100" y2="122" />
                    </g>

                    <!-- Terminal building -->
                    <rect x="834" y="64" width="162" height="8" rx="2" fill="#0369a1" />
                    <text x="915" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="3" fill="#ffffff">AIRPORT</text>
                    <rect x="840" y="72" width="150" height="40" rx="4" fill="#f8fafc" />
                    <g fill="#7dd3fc" stroke="#0ea5e9" stroke-width="1.5">
                        <rect x="848" y="82" width="16" height="14" rx="2" />
                        <rect x="870" y="82" width="16" height="14" rx="2" />
                        <rect x="892" y="82" width="16" height="14" rx="2" />
                        <rect x="914" y="82" width="16" height="14" rx="2" />
                    </g>
                    <rect x="938" y="88" width="20" height="24" rx="3" fill="#0369a1" />
                    <rect x="966" y="86" width="22" height="26" rx="3" fill="#0284c7" />

                    <!-- Control tower -->
                    <rect x="832" y="46" width="18" height="24" fill="#e2e8f0" />
                    <rect x="828" y="40" width="26" height="7" rx="2" fill="#f97316" />
                    <rect x="834" y="48" width="14" height="8" fill="#0ea5e9" />

                    <!-- Plane -->
                    <ellipse cx="1042" cy="104" rx="38" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
                    <path d="M 1072 104 L 1080 86 L 1088 104 Z" fill="#0284c7" />
                    <rect x="1068" y="98" width="16" height="4" rx="2" fill="#0ea5e9" />
                    <path d="M 1030 104 L 1016 113 L 1052 113 L 1040 104 Z" fill="#38bdf8" />
                    <g fill="#0369a1">
                        <circle cx="1010" cy="103" r="3" />
                        <circle cx="1020" cy="103" r="3" />
                        <circle cx="1030" cy="103" r="3" />
                        <circle cx="1040" cy="103" r="3" />
                        <circle cx="1050" cy="103" r="3" />
                    </g>
                </g>

                <!-- Sand / ground strip -->
                <rect x="0" y="120" width="1100" height="50" fill="#fde68a" opacity="0.5" />
            </svg>
        </div>
    </header>

    <!-- Active Feed Container -->
    <div class="feed">

        <!-- Mobile upload banners: big tap targets shown on the home screen.
             Each one opens the matching hidden file input; the banner hides
             itself once its roster has been imported. -->
        <div id="uploadBanners" class="upload-banners">
            <div class="upload-banners-inner">
                <label for="pdfDepartures" id="uploadBannerDepartures" class="upload-banner banner-departures">
                    <span class="upload-banner-emoji">🛫</span>
                    <span class="upload-banner-text">
                        <strong>DEPARTURES</strong>
                        <small>Upload departures PDF</small>
                    </span>
                    <span class="upload-banner-arrow">+</span>
                    <span class="upload-banner-dismiss" onclick="event.preventDefault();event.stopPropagation();dismissUploadBanner('uploadBannerDepartures')">✕</span>
                </label>
                <label for="excelDrivers" id="uploadBannerDrivers" class="upload-banner banner-drivers">
                    <span class="upload-banner-emoji">🚌</span>
                    <span class="upload-banner-text">
                        <strong>DRIVERS</strong>
                        <small>Upload drivers sheet</small>
                    </span>
                    <span class="upload-banner-arrow">+</span>
                    <span class="upload-banner-dismiss" onclick="event.preventDefault();event.stopPropagation();dismissUploadBanner('uploadBannerDrivers')">✕</span>
                </label>
                <label for="pdfArrivals" id="uploadBannerArrivals" class="upload-banner banner-arrivals">
                    <span class="upload-banner-emoji">🛬</span>
                    <span class="upload-banner-text">
                        <strong>ARRIVALS</strong>
                        <small>Upload arrivals PDF</small>
                    </span>
                    <span class="upload-banner-arrow">+</span>
                    <span class="upload-banner-dismiss" onclick="event.preventDefault();event.stopPropagation();dismissUploadBanner('uploadBannerArrivals')">✕</span>
                </label>
                <label for="excelAirportPlan" id="uploadBannerAirport" class="upload-banner banner-airport">
                    <span class="upload-banner-emoji">✈️</span>
                    <span class="upload-banner-text">
                        <strong>FLIGHT PLAN</strong>
                        <small>Upload airport plan sheet</small>
                    </span>
                    <span class="upload-banner-arrow">+</span>
                    <span class="upload-banner-dismiss" onclick="event.preventDefault();event.stopPropagation();dismissUploadBanner('uploadBannerAirport')">✕</span>
                </label>
            </div>
        </div>

        <div id="statusMessage" class="status-card">
            <div class="status-sun">☀️</div>
            <div class="status-title">Summertimes Dispatch Hub</div>
            <p class="status-hint">Upload your PDF manifests or Excel rosters above to initialize active transfer runs.</p>
        </div>

        <div id="manifestsContainer" class="feed-grid"></div>
    </div>

    <!-- QR Desktop Modal Window -->
    <div id="desktopModal" class="modal-overlay hidden" onclick="closeDesktopModal(event)">
        <div class="modal-card modal-sm" onclick="event.stopPropagation()">
            <div class="modal-icon">📲</div>
            <div>
                <h3 id="modalPassengerName" class="modal-title">PASSENGER CONTACT</h3>
                <p id="modalPhoneNumber" class="modal-phone"></p>
                <p id="modalActionType" class="modal-action"></p>
            </div>

            <div class="qr-box">
                <div id="qrcodeCanvas" class="qr-canvas"></div>
                <video id="cameraPreviewStream" autoplay muted playsinline class="camera-video hidden"></video>
            </div>

            <div class="modal-actions">
                <button onclick="copyModalNumber()" class="btn btn-subtle">📋 Copy Number</button>
                <button onclick="stopCameraAndCloseModal()" class="btn btn-close">✕ Close</button>
            </div>
        </div>
    </div>

    <!-- Full Voucher Modal - opened by tapping a voucher number badge. Shows every
         stop and every passenger for that voucher, ignoring the active search text
         and any category/operator filters, so a search match doesn't hide the rest
         of the voucher. -->
    <div id="fullVoucherModal" class="modal-overlay align-top hidden" onclick="closeFullVoucherModal(event)">
        <div class="modal-card modal-lg" onclick="event.stopPropagation()">
            <div class="modal-head">
                <h3 class="modal-head-title">Full Voucher</h3>
                <button onclick="closeFullVoucherModal()" class="modal-close-btn">✕</button>
            </div>
            <div id="fullVoucherModalBody" class="modal-body"></div>
        </div>
    </div>

    <!-- Local libraries: pdf.js, qrcodejs, SheetJS (all offline) -->
    <script src="js/vendor/pdf.min.js"></script>
    <script src="js/vendor/qrcode.min.js"></script>
    <script src="js/vendor/xlsx.full.min.js"></script>
    <script src="js/app.js?v=5"></script>
</body>
</html>
